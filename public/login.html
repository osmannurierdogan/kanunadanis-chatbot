<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | Mevzuat AI</title>
  <!-- SEO & Meta Tags -->
  <meta name="description" content="Mevzuat AI premium ChatGPT klonuna giriş yapın.">
  
  <!-- Google Fonts (Inter & Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Styling -->
  <link rel="stylesheet" href="style.css?v=1.0.2">
  
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">
  <!-- Inline blocking script to apply the theme instantly before content renders -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('mevzuat_theme') || 'system';
      const isLight = savedTheme === 'light' || 
        (savedTheme === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
      if (isLight) {
        document.body.classList.add('light-theme');
      }
      
      // If already logged in, fast redirect to chat app
      if (localStorage.getItem('mevzuat_logged_in') === 'true') {
        window.location.href = 'index.html';
      }
    })();
  </script>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <i data-lucide="scale"></i>
        </div>
        <h1>Giriş Yap</h1>
        <p>Mevzuat AI ile hukuki ve yazılımsal süreçlerinizi hızlandırın</p>
      </div>
      
      <!-- Error Message Container -->
      <div class="auth-error-msg" id="authErrorMsg" style="display: none;"></div>
      
      <!-- Login Form -->
      <form id="loginForm">
        <div class="input-group">
          <label for="authEmail">E-posta Adresi</label>
          <div class="input-icon-wrapper">
            <i data-lucide="mail"></i>
            <input type="email" id="authEmail" placeholder="ornek@domain.com" required autocomplete="email">
          </div>
        </div>
        
        <div class="input-group">
          <label for="authPassword">
            Şifre
            <a href="#" class="auth-link forgot-password-link" id="forgotPasswordLink">Şifremi Unuttum?</a>
          </label>
          <div class="input-icon-wrapper">
            <i data-lucide="lock"></i>
            <input type="password" id="authPassword" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>
        
        <button type="submit" class="auth-submit-btn" id="authSubmitBtn">
          <span>Giriş Yap</span>
          <i data-lucide="arrow-right"></i>
        </button>
      </form>
      
      <div class="auth-divider">
        <span>veya</span>
      </div>
      
      <button type="button" class="google-auth-btn" id="googleAuthBtn">
        <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Google ile Giriş Yap</span>
      </button>
      
      <div class="auth-footer">
        <span>Hesabınız yok mu?</span>
        <a href="register.html" class="auth-link">Kayıt Ol</a>
      </div>
      
      <!-- Mock Auth Mode Notice -->
      <div class="mock-auth-badge" id="mockAuthBadge" style="display: none;">
        <i data-lucide="shield-alert"></i>
        <span>Firebase henüz bağlı değil. Geliştirici (Mock) modunda çalışıyor.</span>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs Compat Mode -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <!-- Reusable Authentication Script -->
  <script src="auth-client.js"></script>
</body>
</html>
